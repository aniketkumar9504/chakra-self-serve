#stage .login{position:absolute;right:80px;top:13px;height:38px;padding:0 20px;border:1px solid var(--n200);border-radius:100px;font:500 14px var(--sat);display:grid;place-items:center;background:#fff}
#zone{position:absolute;left:720px;top:0;width:600px;height:824px;transition:opacity .45s var(--ease)}
#zone.out{opacity:0}

/* ---------- switcher ---------- */
#measure{position:fixed;left:-4000px;top:0;width:600px;height:824px;visibility:hidden;pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;background:#fff;border-top:1px solid var(--n100);display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:16px;row-gap:8px;padding:14px 20px 12px}
#bar .prog{position:absolute;left:0;right:0;top:-1px;height:3px;background:transparent}
#bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet))}
#bar .nav{display:flex;align-items:flex-end;gap:8px;grid-column:1/3;min-width:0}
#bar .groups{display:flex;gap:18px;overflow-x:auto;min-width:0;scrollbar-width:none}
#bar .grp{display:flex;flex-direction:column;gap:5px}
#bar .gl{font:500 10.5px var(--sat);letter-spacing:.07em;text-transform:uppercase;color:var(--n400);padding-left:2px}
#bar .btns{display:flex;gap:5px}
#bar button{font:500 13px var(--sat);border:1px solid var(--n200);background:#fff;color:var(--n800);height:34px;padding:0 12px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
#bar button:hover{background:var(--n50)}
#bar .btns button b{font-weight:700;color:var(--n950)}
#bar .btns button.on{background:var(--n950);color:#fff;border-color:var(--n950)}
#bar .btns button.on b{color:var(--cyan)}
#bar .arrow{width:34px;padding:0;justify-content:center;font-size:18px}
#bar .blurb{grid-column:1/4;font-size:13px;color:var(--n600);line-height:1.4;min-width:0}
#bar .blurb b{color:var(--n950);font-weight:700}
#bar .ctl{display:flex;gap:6px;align-items:center;grid-column:3;grid-row:1;align-self:end}
#bar .count{font:500 12px var(--sat);color:var(--n500);margin-right:6px;font-variant-numeric:tabular-nums}

/* ---------- shared bits ---------- */
.kal{font-family:var(--kal);font-weight:400}
.spk{display:inline-block;width:13px;height:13px;flex:none}
.spk svg{display:block;width:100%;height:100%}
.spk circle{transition:fill .1s,opacity .1s}
.logo{display:inline-block;flex:none;vertical-align:middle}
.w{opacity:0;display:inline;animation:wIn .35s var(--ease) forwards}
@keyframes wIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.interim{font-style:italic;opacity:.7}
.mark{background:linear-gradient(color-mix(in srgb,var(--cyan) 55%,transparent),color-mix(in srgb,var(--cyan) 55%,transparent)) no-repeat 0 100%/0% 100%;border-radius:.2em;transition:background-size .6s var(--ease-out);position:relative;cursor:help}
.mark.on{background-size:100% 100%}
.tip{position:absolute;z-index:50;pointer-events:none;background:#fff;color:var(--n900);border:1px solid var(--n100);box-shadow:0 12px 44px 20px rgba(0,0,0,.08);border-radius:10px;padding:10px 12px;font:400 12.5px/1.45 var(--sat);width:230px;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.tip.show{opacity:1;transform:none}
.tip b{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ibtn{width:34px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--n200);background:#fff;color:var(--n800)}
.ibtn svg{width:16px;height:16px}
.chip-fu{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--sat);padding:2px 8px;border-radius:100px;background:#e6fafe;border:1px solid var(--cyan);color:#0b5566;margin-left:6px;animation:pop .45s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}

/* ---------- B-style light kit (shared by E–H) ---------- */
.lk-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(138,233,255,.45),rgba(156,153,255,.18) 45%,transparent 70%);filter:blur(30px);animation:breathe 7s ease-in-out infinite;pointer-events:none}
.lk-head{position:absolute;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n600);animation:rise .6s var(--ease-out) both}
.lk-head .kal{font-size:20px;color:var(--n950)}
.lk-head .role{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:100px;background:#fff;border:1px solid var(--n100)}
.lk-card{background:#fff;border:1px solid var(--n100);border-radius:24px;padding:18px 20px;box-shadow:0 24px 60px rgba(18,20,24,.10)}
.lk-who{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--n600)}
.lk-lvl{margin-left:auto;font:500 11px var(--sat);padding:3px 9px;border-radius:100px;background:var(--n950);color:#fff}
.lk-q{font:400 21px/1.25 var(--kal);color:var(--n950);letter-spacing:-.01em}
.lk-a{background:var(--n50);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.5;color:var(--n700);display:flex;gap:9px}
.lk-a img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;margin-top:1px}
.lk-eb{display:flex;align-items:center;gap:6px;font:500 10.5px var(--sat);letter-spacing:.07em;text-transform:uppercase;color:var(--n500)}
.lk-eb i{width:6px;height:6px;border-radius:50%;background:var(--info)}
.lk-dots{display:inline-flex;gap:4px}
.lk-dots i{width:8px;height:8px;border-radius:50%;background:var(--n100);transition:background .3s,transform .3s var(--ease-out)}
.lk-dots i.on{background:#1aac4e;transform:scale(1.1)}
.lk-badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:8px;font:700 13px var(--sat);background:#fff5ef;color:#d03d01;border:1px solid #ffd9c6;font-variant-numeric:tabular-nums;transition:all .5s}
.lk-badge.ok{background:#f5fdf8;color:#146711;border-color:#c7e4c6}

/* Shared engine: timeline, word streaming, Chakra sparkle, logo, particle waveform. */
const E = (() => {
  let GEN = 0, PAUSED = false, uid = 0, SPEED = 1, FF = false, VT = 0;
  class Cancel extends Error {}

  // Pausable, cancellable wait. In fast-forward (measure) mode it resolves at once and just adds up time.
  function wait(ms) {
    if (FF) { VT += ms; return Promise.resolve(); }
    ms = ms / SPEED;
    const g = GEN;
    return new Promise((res, rej) => {
      let el = 0, last = performance.now();
      (function tick(now) {
        if (g !== GEN) return rej(new Cancel());
        if (!PAUSED) el += now - last;
        last = now;
        el >= ms ? res() : requestAnimationFrame(tick);
      })(last);
    });
  }

  // Stream words into el. [[phrase]] becomes <span class="mark">. Returns {marks}
  async function stream(el, text, perWord = 85, onWord) {
    const toks = text.split(' ');
    let target = el, marks = [];
    for (let i = 0; i < toks.length; i++) {
      let t = toks[i];
      if (t.startsWith('[[')) { t = t.slice(2); const m = document.createElement('span'); m.className = 'mark'; if (el.childNodes.length) el.appendChild(document.createTextNode(' ')); el.appendChild(m); target = m; marks.push(m); }
      let close = false;
      if (t.includes(']]')) { close = true; t = t.replace(']]', ''); }
      const s = document.createElement('span');
      s.className = 'w'; s.textContent = t;
      if (target.childNodes.length || (target === el && el.childNodes.length)) target.appendChild(document.createTextNode(' '));
      target.appendChild(s);
      if (close) target = el;
      onWord && onWord(i);
      await wait(perWord + (/[.,?—]$/.test(t) ? perWord * 2.2 : 0));
    }
    return { marks };
  }

  // Chakra mark (single path, gradient)
  function logo(size = 14, mono) {
    const id = 'lg' + (++uid);
    const fill = mono ? mono : `url(#${id})`;
    return `<svg class="logo" width="${size}" height="${size * 17 / 18}" viewBox="0 0 18 17" fill="none"><path d="M13.7461 0.97168L12.0547 3.93945C10.4553 6.74709 10.68 10.3529 12.6133 12.8994L14.5811 15.4902L13.3477 16.5996L11.3809 14.0088C9.01002 10.8861 8.73399 6.46442 10.6953 3.02148L12.3867 0.0537109L13.7461 0.97168ZM6.9668 2.94727C9.0528 6.40882 8.82313 10.9466 6.40039 14.1377L4.61035 16.4951L3.37695 15.3857L5.16699 13.0283C7.14278 10.4259 7.33017 6.72526 5.62891 3.90234L3.85254 0.955078L5.19043 0L6.9668 2.94727ZM3.35352 4.38965C5.78039 6.49633 5.52849 10.5928 2.86523 12.3281L0.821289 13.6592L0 12.165L2.04395 10.834C3.74913 9.72285 3.91036 7.09983 2.35645 5.75098L0.200195 3.87891L1.19727 2.51758L3.35352 4.38965ZM17.7998 3.87891L15.6436 5.75098C14.0896 7.09983 14.2509 9.72285 15.9561 10.834L18 12.165L17.1787 13.6592L15.1348 12.3281C12.4715 10.5928 12.2196 6.49633 14.6465 4.38965L16.8027 2.51758L17.7998 3.87891Z" fill="${fill}"/><defs><linearGradient id="${id}" x1="9" y1="0" x2="9" y2="25.7" gradientUnits="userSpaceOnUse"><stop stop-color="#8AE9FF"/><stop offset="0.78" stop-color="#9C99FF"/></linearGradient></defs></svg>`;
  }

  // Sparkle: 3x3 dots. modes: static | think | wave
  function sparkle(mode = 'static', dark = false) {
    const pos = [1.5, 6.5, 11.5];
    let c = '';
    for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) c += `<circle cx="${pos[q]}" cy="${pos[r]}" r="1.5"/>`;
    return `<span class="spk${dark ? ' dk' : ''}" data-mode="${mode}"><svg viewBox="0 0 13 13">${c}</svg></span>`;
  }
  const RING = [0, 1, 2, 5, 8, 7, 6, 3];
  let tick = 0;
  setInterval(() => {
    if (PAUSED) return;
    tick++;
    document.querySelectorAll('.spk').forEach((s) => {
      const dark = s.classList.contains('dk');
      const P = dark ? '#121418' : '#9c99ff', S = dark ? '#c1c2d6' : '#8ae9ff';
      const cs = s.querySelectorAll('circle'), mode = s.dataset.mode;
      cs.forEach((c, i) => {
        let on;
        if (mode === 'think') { const k = tick % 8; on = i === RING[k] || i === RING[(k + 1) % 8] || i === 4; }
        else if (mode === 'wave') { const row = 2 - (Math.floor(tick / 3.5) % 3); on = Math.floor(i / 3) === row; }
        else on = i === 4 || i === 1 || i === 3 || i === 5 || i === 7;
        c.setAttribute('fill', on ? P : S);
        c.setAttribute('opacity', mode === 'static' || on ? 1 : 0.45);
      });
    });
  }, 100);

  // ---- Particle waveform (port of the candidate app's WebGL ocean, simplified to 2D canvas) ----
  const waves = new Set();
  const STATE = {
    idle: { e: 0.12, col: [90, 90, 90] },
    listening: { e: 0.3, col: [110, 110, 115] },
    thinking: { e: 0.18, col: [100, 150, 160] },
    speaking: { e: 1, col: [120, 200, 200] },
  };
  class Wave {
    constructor(canvas, o = {}) {
      this.c = canvas; this.x = canvas.getContext('2d');
      this.rows = o.rows || 34; this.cols = o.cols || 120;
      this.horizon = o.horizon ?? 0.36; this.spread = o.spread ?? 1.7; this.size = o.size ?? 2.1;
      this.bright = o.bright ?? 1;
      this.state = 'idle'; this.e = 0.1; this.col = [90, 90, 90]; this.t = Math.random() * 50; this.mouse = null; this.mb = 0;

    destroy() { waves.delete(this); }

      let target = st.e;
      if (this.state === 'speaking') target = 0.45 + 0.55 * Math.abs(Math.sin(this.t * 3.1) * Math.sin(this.t * 1.27 + 1));
      if (this.state.startsWith('listening')) target = 0.22 + 0.25 * Math.abs(Math.sin(this.t * 2.3) * Math.sin(this.t * 0.9));
      this.e += (target - this.e) * 0.08;
      for (let i = 0; i < 3; i++) this.col[i] += (st.col[i] - this.col[i]) * 0.08;
      this.mb += ((this.mouse == null ? 0 : 1) - this.mb) * 0.1;
      if (!PAUSED) this.t += 0.05 * (0.6 + this.e);
      const t = this.t, amp = (H / 150) * (5 + this.e * 16), hz = H * this.horizon;
      const [r, g, b] = this.col.map((v) => Math.min(255, v * this.bright) | 0);
      x.fillStyle = `rgb(${r},${g},${b})`;
      for (let ri = 0; ri < this.rows; ri++) {
        const d = 1 - ri / (this.rows - 1); // 1 far, 0 near
        const sc = 1 / (1 + d * 2.4);
        x.globalAlpha = 0.18 + 0.82 * sc * sc;
        const sz = Math.max(0.7, this.size * sc);
        const rowPhase = ri * 0.35;
        for (let ci = 0; ci < this.cols; ci++) {
          const u = ci / (this.cols - 1);
          const env = 0.35 + 0.65 * Math.sin(Math.PI * u);
          let wy = Math.sin(ci * 0.09 + t * 0.9 + rowPhase) * amp + Math.sin(ci * 0.19 + t * 1.4 - rowPhase * 0.6) * amp * 0.5
            + (Math.sin(ci * 0.4 + t * 2.5) * 2 + Math.cos(ci * 0.3 - t * 1.8) * 1.4) * this.e * (H / 150);
          const sx = W / 2 + (u - 0.5) * W * this.spread * sc;
          if (this.mb > 0.01) { const dx = (sx / W) - this.mouse; wy += Math.exp(-(dx * dx) / 0.006) * H * 0.16 * this.mb; }
          const sy = hz + H * (1 - this.horizon) * 0.98 * sc - wy * sc * env;
          if (sx < -4 || sx > W + 4) continue;
          x.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
        }
      }
      x.globalAlpha = 1;
    }
  }
  (function loop() { waves.forEach((w) => { try { w.frame(); } catch (e) { console.error(e); } }); requestAnimationFrame(loop); })();

  // Tooltip helper (one floating tip per zone)
  function tip(zone, target, html, dx = 0, dy = 10) {
    let t = zone.querySelector(':scope > .tip');
    if (!t) { t = h('<div class="tip"></div>'); zone.appendChild(t); }
    const show = () => {
      t.innerHTML = typeof html === 'function' ? html() : html;
      const zr = zone.getBoundingClientRect(), r = target.getBoundingClientRect(), s = zr.width / zone.offsetWidth;
      let left = (r.left - zr.left) / s + dx, top = (r.bottom - zr.top) / s + dy;
      left = Math.max(0, Math.min(zone.offsetWidth - 240, left));
      t.style.left = left + 'px'; t.style.top = top + 'px'; t.classList.add('show');
    };
    target.addEventListener('pointerenter', show);
    target.addEventListener('pointerleave', () => t.classList.remove('show'));
  }

  // Tween over dur ms (speed-scaled, pausable). fn(k) gets eased-free progress 0..1.
  function tween(dur, fn) {
    if (FF) { VT += dur; fn(1); return Promise.resolve(); }
    const g = GEN, d = dur / SPEED;
    return new Promise((res, rej) => {
      let el = 0, last = performance.now();
      (function f(now) {
        if (g !== GEN) return rej(new Cancel());
        if (!PAUSED) el += now - last;
        last = now;
        const k = Math.min(1, el / d); fn(k);
        k < 1 ? requestAnimationFrame(f) : res();
      })(last);
    });
  }

  // Element rect in zone (unscaled) coordinates
  function rel(zone, el) {
    const zr = zone.getBoundingClientRect(), s = zr.width / zone.offsetWidth || 1, r = el.getBoundingClientRect();
    return { x: (r.left - zr.left) / s, y: (r.top - zr.top) / s, w: r.width / s, h: r.height / s };
  }
  // Fly a highlighted phrase from one element to another along an arc
  async function fly(zone, from, to, text, dur = 900, lift = 70) {
    const a = rel(zone, from), b = rel(zone, to);
    const f = h(`<div class="lk-fly"></div>`); f.textContent = text; zone.appendChild(f);
    try {
      await tween(dur, (k) => {
        const e = 1 - Math.pow(1 - k, 3);
        const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e - Math.sin(Math.PI * e) * lift;
        f.style.transform = `translate(${x}px,${y}px) scale(${1 - 0.12 * Math.sin(Math.PI * e)})`;
      });
    } finally { f.remove(); }
  }

  return {
    wait, stream, tween, rel, fly,
    ffStart() { FF = true; VT = 0; }, ffStop() { FF = false; return VT; },
    setSpeed(s) { SPEED = s; }, get speed() { return SPEED; }, logo, sparkle, h, Wave, tip, Cancel,
    clearWaves() { waves.forEach((w) => w.destroy()); }, get gen() { return GEN; }, bump() { GEN++; waves.forEach((w) => w.destroy()); },
    setPaused(p) { PAUSED = p; document.body.classList.toggle('paused', p); }, get paused() { return PAUSED; },
    scrollBottom(el) { el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); },
  };
})();

<script>
(() => {
  const LOOP = 15000, FADE = 450, SETTLE = 300;
  const zone = document.getElementById('zone'), stage = document.getElementById('stage'),
        vp = document.getElementById('viewport'), measureHost = document.getElementById('measure');
  document.getElementById('opt-css').textContent = OPTIONS.map((o) => o.css).join('\n');
  const me = OPTIONS.find((o) => o.key === 'E') || OPTIONS[0];
  const SW = 600, SH = 510;
  const fit = () => { const s = Math.min(vp.clientWidth / SW, vp.clientHeight / SH); stage.style.transform = `translate(-50%,-50%) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let speed = 1, pad = 0;
  async function measure() {
    E.ffStart(); let vt = 0;
    try { measureHost.innerHTML = ''; me.build(measureHost); await me.play(); } catch (e) { console.error(e); }
    finally { vt = E.ffStop(); me.destroy && me.destroy(); E.clearWaves(); measureHost.innerHTML = ''; }
    const target = LOOP - FADE - SETTLE;
    speed = Math.min(2, Math.max(1, vt / target)); pad = Math.max(0, target - vt);
  }
  (async () => {
    await measure(); E.setSpeed(speed);
    const g = E.gen;
    try {
      while (true) {
        if (g !== E.gen) return;
        me.destroy && me.destroy(); E.clearWaves(); zone.innerHTML = '';
        me.build(zone); zone.classList.remove('out');
        await me.play();
        if (pad) await E.wait(pad);
        zone.classList.add('out');
        await E.wait(FADE * E.speed);
      }
    } catch (e) { if (!(e instanceof E.Cancel)) console.error(e); }
  })();
})();
</script>
