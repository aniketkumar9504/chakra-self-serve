<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a HackerRank demo</title>
  <meta name="description" content="Book a 30-minute HackerRank demo. Enter your email once — we autofill your details and you pick a time in under a minute." />

  <!-- hr-design (HRDS) tokens + self-hosted brand fonts, then page styles -->
  <link rel="stylesheet" href="styles/hrds/tokens.css" />
  <link rel="stylesheet" href="styles/hrds/theme.css" />
  <link rel="stylesheet" href="styles/hrds/fonts.css" />
  <link rel="stylesheet" href="styles/book-demo-classic.css?v=2" />
</head>
<body>
  <header class="bd-header">
    <a class="bd-header__logo" href="#" aria-label="HackerRank home">
      <img src="assets/logo-dark.svg" alt="HackerRank" width="153" height="16" />
    </a>
    <nav class="bd-header__actions" aria-label="Quick actions">
      <a class="bd-header__cta" href="#" data-action="trial">Start a free trial</a>
      <a class="bd-header__cta bd-header__cta--primary" href="#" data-action="contact">Contact us</a>
    </nav>
  </header>

  <div id="bd-app"><!-- screens render here --></div>

  <footer class="bd-footer">
    <p class="bd-footer__text">
      Are you a developer looking to learn?
      <a class="bd-footer__link" href="#" data-action="community">Join our community &rarr;</a>
    </p>
  </footer>

  <script type="module" src="scripts/book-demo-classic/app.js?v=2"></script>

</html>
